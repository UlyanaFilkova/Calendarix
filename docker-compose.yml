version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: calendarix-postgres
    environment:
      POSTGRES_USER: calendarix
      POSTGRES_PASSWORD: password
      POSTGRES_DB: calendarix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendarix -d calendarix"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Telegram bot
  bot:
    build: ./bot-service
    container_name: calendarix-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}

volumes:
  pgdata:
